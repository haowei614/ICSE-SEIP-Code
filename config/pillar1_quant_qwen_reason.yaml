# Pillar 1 quant ladder smoke: Qwen2.5 × Q8_0 + Q4_K_M × TF_Reason first.
# Requires llama-cpp-python CUDA + GGUFs under /workspace/models/gguf/.
measurement_basis: A
seed: 20260905
sampling:
  size_per_task: 40
  seed: 20260905
  stratified: true

hardware_profile: rtx4090_aisin_repair
output_dir: results/pillar1_quant

models:
  - id: qwen25_7b_instruct
    name: Qwen2.5-7B-Instruct
    hf: /workspace/models/Qwen2.5-7B-Instruct
    gguf_path: null   # filled per-precision below via driver convention
    highest_feasible_precision: FP16
    infeasible_reason: null
    gguf_by_precision:
      Q8_0: /workspace/models/gguf/qwen25_7b_instruct/Qwen2.5-7B-Instruct-Q8_0.gguf
      Q4_K_M: /workspace/models/gguf/qwen25_7b_instruct/Qwen2.5-7B-Instruct-Q4_K_M.gguf

# Quant only (FP16 already in pillar1_fp16/).
quantization: [Q8_0, Q4_K_M]
reference_precision: null

cloud_reference:
  id: cloud_frontier_ref
  endpoint_env: CLOUD_REF_ENDPOINT
  key_env: CLOUD_REF_API_KEY
  enabled: false

tasks:
  - id: TF_Reason
    name: trace_link_recovery
    kind: trace_link
    dataset: trace_etour
    long_context: true

decoding:
  temperature: 0.0
  top_p: 1.0
  top_k: null
  max_new_tokens: 256
  max_input_tokens: 8192
  use_chat_template: false   # llama.cpp path uses raw prompt unless adapted
  enable_thinking: false
  seed: 20260905

reproducibility:
  repeats_per_cell: 1
  n_ctx: 8192
  n_batch: 512
  hardware_platform: aisin-repair-0 / rke2-w2 / RTX 4090 24GB
  gpu_model: NVIDIA GeForce RTX 4090
  gpu_vram_gb: 24

serving:
  n_gpu_layers: -1
  n_ctx: 8192
  n_batch: 512

run_order: [TF_Reason]
