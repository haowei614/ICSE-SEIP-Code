# Aligned GGUF ladder v2.
# input_mode token_ids: LlamaCppBackend passes HF chat-template ids
# (add_special_tokens=False), not a string that llama.cpp may BOS-prefix.
# Frozen to match the existing eval sample. max_new_tokens is 1024, not the
# 256 cap used by pillar1_f16_gguf_aligned / pillar1_quant_aligned.
measurement_basis: A
seed: 20260905
sampling:
  size_per_task: 40
  seed: 20260905
  stratified: true

hardware_profile: rtx4090_aisin_repair
output_dir: results/pillar1_aligned_v2

models:
  - id: qwen25_7b_instruct
    name: Qwen2.5-7B-Instruct
    hf: /workspace/models/Qwen2.5-7B-Instruct
    hf_id: Qwen/Qwen2.5-7B-Instruct
    gguf_by_precision:
      F16: /workspace/models/gguf/qwen25_7b_instruct/Qwen2.5-7B-Instruct-f16.gguf
      Q8_0: /workspace/models/gguf/qwen25_7b_instruct/Qwen2.5-7B-Instruct-Q8_0.gguf
      Q6_K: /workspace/models/gguf/qwen25_7b_instruct/Qwen2.5-7B-Instruct-Q6_K.gguf
      Q4_K_M: /workspace/models/gguf/qwen25_7b_instruct/Qwen2.5-7B-Instruct-Q4_K_M.gguf
  - id: mistral_7b_instruct
    name: Mistral-7B-Instruct-v0.3
    hf: /workspace/models/Mistral-7B-Instruct-v0.3
    hf_id: mistralai/Mistral-7B-Instruct-v0.3
    gguf_by_precision:
      F16: /workspace/models/gguf/mistral_7b_instruct/mistral_7b_instruct-f16.gguf
      Q8_0: /workspace/models/gguf/mistral_7b_instruct/Mistral-7B-Instruct-v0.3-Q8_0.gguf
      Q6_K: /workspace/models/gguf/mistral_7b_instruct/Mistral-7B-Instruct-v0.3-Q6_K.gguf
      Q4_K_M: /workspace/models/gguf/mistral_7b_instruct/Mistral-7B-Instruct-v0.3-Q4_K_M.gguf
  - id: llama31_8b_instruct
    name: Llama-3.1-8B-Instruct
    hf: /workspace/models/Llama-3.1-8B-Instruct
    hf_id: meta-llama/Llama-3.1-8B-Instruct
    gguf_by_precision:
      F16: /workspace/models/gguf/llama31_8b_instruct/llama31_8b_instruct-f16.gguf
      Q8_0: /workspace/models/gguf/llama31_8b_instruct/Meta-Llama-3.1-8B-Instruct-Q8_0.gguf
      Q6_K: /workspace/models/gguf/llama31_8b_instruct/Meta-Llama-3.1-8B-Instruct-Q6_K.gguf
      Q4_K_M: /workspace/models/gguf/llama31_8b_instruct/Meta-Llama-3.1-8B-Instruct-Q4_K_M.gguf
  - id: gemma2_9b_it
    name: Gemma-2-9B-it
    hf: /workspace/models/Gemma-2-9B-it
    hf_id: google/gemma-2-9b-it
    gguf_by_precision:
      F16: /workspace/models/gguf/gemma2_9b_it/gemma2_9b_it-f16.gguf
      Q8_0: /workspace/models/gguf/gemma2_9b_it/gemma-2-9b-it-Q8_0.gguf
      Q6_K: /workspace/models/gguf/gemma2_9b_it/gemma-2-9b-it-Q6_K.gguf
      Q4_K_M: /workspace/models/gguf/gemma2_9b_it/gemma-2-9b-it-Q4_K_M.gguf

quantization: [F16, Q8_0, Q6_K, Q4_K_M]
reference_precision: null

tasks:
  - id: TF_Surface
    name: nfr_classification
    kind: classification
    dataset: promise_nfr
    long_context: false
  - id: TF_Mid
    name: anaphoric_span_detection
    kind: span_detection
    dataset: damir_pure
    long_context: false
  - id: TF_Reason
    name: trace_link_recovery
    kind: trace_link
    dataset: trace_etour
    long_context: true

decoding:
  temperature: 0.0
  top_p: 1.0
  top_k: null
  max_new_tokens: 1024
  max_input_tokens: 8192
  use_chat_template: true
  enable_thinking: false
  use_grammar: false
  input_mode: token_ids
  seed: 20260905

reproducibility:
  repeats_per_cell: 1
  n_ctx: 8192
  n_batch: 512
  prompt_version: p3

serving:
  n_gpu_layers: -1
  n_ctx: 8192
  n_batch: 512

run_order: [TF_Mid, TF_Reason, TF_Surface]
