# Aligned Llama-3.1-8B Q8/Q6/Q4 on Surface and Mid only.
# Reason is held: current eTour catalog exceeds n_ctx=8192 and does not
# match the short catalog used by the existing aligned F16 Reason cells.
measurement_basis: A
seed: 20260905
sampling:
  size_per_task: 40
  seed: 20260905
  stratified: true

hardware_profile: rtx4090_aisin_repair
output_dir: results/pillar1_quant_aligned

models:
  - id: llama31_8b_instruct
    name: Llama-3.1-8B-Instruct
    hf: meta-llama/Llama-3.1-8B-Instruct
    gguf_by_precision:
      Q8_0: /workspace/models/gguf/llama31_8b_instruct/Meta-Llama-3.1-8B-Instruct-Q8_0.gguf
      Q6_K: /workspace/models/gguf/llama31_8b_instruct/Meta-Llama-3.1-8B-Instruct-Q6_K.gguf
      Q4_K_M: /workspace/models/gguf/llama31_8b_instruct/Meta-Llama-3.1-8B-Instruct-Q4_K_M.gguf

quantization: [Q8_0, Q6_K, Q4_K_M]
reference_precision: null

tasks:
  - id: TF_Surface
    name: nfr_classification
    kind: classification
    dataset: promise_nfr
    long_context: false
  - id: TF_Mid
    name: anaphoric_span_detection
    kind: span_detection
    dataset: damir_pure
    long_context: false

decoding:
  temperature: 0.0
  top_p: 1.0
  top_k: null
  max_new_tokens: 256
  max_input_tokens: 8192
  use_chat_template: true
  enable_thinking: false
  use_grammar: false
  seed: 20260905

reproducibility:
  repeats_per_cell: 1
  n_ctx: 8192
  n_batch: 512

serving:
  n_gpu_layers: -1
  n_ctx: 8192
  n_batch: 512

run_order: [TF_Surface, TF_Mid]
