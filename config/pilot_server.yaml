# Server pilot on aisin-repair (RTX 4090). Re-do after 2026-08-31 pod wipe.
# Archive this file with results/pilot_server/ on the PVC.
#
# Blockers before a REAL (non-mock) run:
#   1. Model weights: GGUF paths for llama_cpp, OR HF cache for transformers FP16.
#   2. llama-cpp-python with CUDA if running the quant ladder (Q8/Q4).
# Datasets locked 2026-09-05: promise_nfr / damir_pure / trace_etour (see data/SOURCES.md).
#
# Prior lost run (2026-08-31): TF_Reason x qwen3_8b x F16 @ 32k — 3 rows only.

measurement_basis: A
seed: 20260905
sampling:
  size_per_task: 40
  seed: 20260905
  stratified: true

hardware_profile: rtx4090_aisin_repair   # see config/hardware_rtx4090.yaml
output_dir: results/pilot_server

models:
  # Pilot model on ephemeral disk (/workspace); results stay on PVC.
  # Pod rebuild wipes /workspace — re-download or move to a larger PVC later.
  - id: qwen3_8b
    name: Qwen3-8B
    hf: /workspace/models/Qwen3-8B
    revision: null
    gguf_repo: null
    gguf_path: null
    highest_feasible_precision: FP16
    infeasible_reason: null

# FP16 reference first (transformers path). Q8/Q4 need llama_cpp + GGUF later.
quantization: []
reference_precision: FP16

cloud_reference:
  id: cloud_frontier_ref
  endpoint_env: CLOUD_REF_ENDPOINT
  key_env: CLOUD_REF_API_KEY
  enabled: false

tasks:
  - id: TF_Surface
    name: nfr_classification
    kind: classification
    dataset: promise_nfr              # Zenodo 268542; see data/SOURCES.md
    long_context: false
  - id: TF_Mid
    name: ambiguity_defect_detection
    kind: span_detection
    dataset: damir_pure               # DAMIR-PURE (Figshare)
    long_context: false
  - id: TF_Reason
    name: trace_link_recovery
    kind: trace_link
    dataset: trace_etour              # eTour gold links (FTLR/CoEST mirror)
    long_context: true

decoding:
  temperature: 0.0
  top_p: 1.0
  top_k: null
  max_new_tokens: 128
  max_input_tokens: 8192
  use_chat_template: true
  enable_thinking: false          # Qwen3: non-thinking mode for format-stable labels
  seed: 20260905

reproducibility:
  repeats_per_cell: 1
  n_ctx: 32768
  n_batch: 512
  hardware_platform: aisin-repair-0 / rke2-w2 / RTX 4090 24GB
  gpu_model: NVIDIA GeForce RTX 4090
  gpu_vram_gb: 24

run_order: [TF_Reason, TF_Surface, TF_Mid]
