measurement_basis: A
seed: 20260905
sampling:
  size_per_task: 40
  seed: 20260905
  stratified: true

hardware_profile: rtx4090_aisin_repair
output_dir: results/pilot_server_v3

models:
  - id: qwen3_8b
    name: Qwen3-8B
    hf: /workspace/models/Qwen3-8B
