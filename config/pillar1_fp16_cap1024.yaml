# Transformers FP16 rerun of the four cells that hit the original cap.
# Same prompts, chat template, and greedy decoding as pillar1_surface_mid_fp16.yaml
# and pillar1_reason_fp16.yaml. Only max_new_tokens changes, from 128 (Mid) or
# 256 (Reason) to 1024. Qwen and Gemma did not hit the cap and are not rerun.
measurement_basis: A
seed: 20260905
sampling:
  size_per_task: 40
  seed: 20260905
  stratified: true

hardware_profile: rtx4090_aisin_repair
output_dir: results/pillar1_fp16_v2

models:
  - id: mistral_7b_instruct
    name: Mistral-7B-Instruct-v0.3
    hf: /workspace/hf-fp16/Mistral-7B-Instruct-v0.3
    hf_id: mistralai/Mistral-7B-Instruct-v0.3
    highest_feasible_precision: FP16
  - id: llama31_8b_instruct
    name: Llama-3.1-8B-Instruct
    hf: /workspace/hf-fp16/Llama-3.1-8B-Instruct
    hf_id: meta-llama/Llama-3.1-8B-Instruct
    highest_feasible_precision: FP16

quantization: []
reference_precision: FP16

tasks:
  - id: TF_Mid
    name: ambiguity_defect_detection
    kind: span_detection
    dataset: damir_pure
    long_context: false
  - id: TF_Reason
    name: trace_link_recovery
    kind: trace_link
    dataset: trace_etour
    long_context: true

decoding:
  temperature: 0.0
  top_p: 1.0
  top_k: null
  max_new_tokens: 1024
  max_input_tokens: 8192
  use_chat_template: true
  enable_thinking: false
  use_grammar: false
  input_mode: string
  seed: 20260905

reproducibility:
  repeats_per_cell: 1
  n_ctx: 32768
  n_batch: 512
  prompt_version: p3

serving:
  n_gpu_layers: -1
  n_ctx: 32768
  n_batch: 512

run_order: [TF_Mid, TF_Reason]
