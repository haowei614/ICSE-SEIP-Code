# Aligned F16 GGUF control: SAME HF chat template as transformers FP16.
# use_chat_template: true  → LlamaCppBackend wraps via AutoTokenizer.apply_chat_template
# before llama.cpp completion (fixes raw-prompt vs chat-template confound).
#
# Optional grammar: set decoding.use_grammar: true for JSON GBNF on Mid/Reason.
measurement_basis: A
seed: 20260905
sampling:
  size_per_task: 40
  seed: 20260905
  stratified: true

hardware_profile: rtx4090_aisin_repair
output_dir: results/pillar1_f16_gguf_aligned

models:
  - id: qwen25_7b_instruct
    name: Qwen2.5-7B-Instruct
    hf: /workspace/models/Qwen2.5-7B-Instruct
    hf_id: Qwen/Qwen2.5-7B-Instruct
    gguf_by_precision:
      F16: /workspace/models/gguf/qwen25_7b_instruct/Qwen2.5-7B-Instruct-f16.gguf
    highest_feasible_precision: F16
  - id: mistral_7b_instruct
    name: Mistral-7B-Instruct-v0.3
    hf: /workspace/models/Mistral-7B-Instruct-v0.3
    hf_id: mistralai/Mistral-7B-Instruct-v0.3
    gguf_by_precision:
      F16: /workspace/models/gguf/mistral_7b_instruct/mistral_7b_instruct-f16.gguf
    highest_feasible_precision: F16
  - id: llama31_8b_instruct
    name: Llama-3.1-8B-Instruct
    hf: /workspace/models/Llama-3.1-8B-Instruct
    hf_id: meta-llama/Llama-3.1-8B-Instruct
    gguf_by_precision:
      F16: /workspace/models/gguf/llama31_8b_instruct/llama31_8b_instruct-f16.gguf
    highest_feasible_precision: F16
  - id: gemma2_9b_it
    name: Gemma-2-9B-it
    hf: /workspace/models/Gemma-2-9B-it
    hf_id: google/gemma-2-9b-it
    gguf_by_precision:
      F16: /workspace/models/gguf/gemma2_9b_it/gemma2_9b_it-f16.gguf
    highest_feasible_precision: F16

quantization: []
reference_precision: F16

tasks:
  - id: TF_Reason
    name: trace_link_recovery
    kind: trace_link
    dataset: trace_etour
    long_context: true
  - id: TF_Mid
    name: anaphoric_span_detection
    kind: span_detection
    dataset: damir_pure
    long_context: false
  - id: TF_Surface
    name: nfr_classification
    kind: classification
    dataset: promise_nfr
    long_context: false

decoding:
  temperature: 0.0
  top_p: 1.0
  top_k: null
  max_new_tokens: 256
  max_input_tokens: 8192
  use_chat_template: true    # ALIGNED with transformers FP16
  enable_thinking: false
  use_grammar: false         # set true for GBNF JSON constraint condition
  seed: 20260905

reproducibility:
  repeats_per_cell: 1
  n_ctx: 8192
  n_batch: 512
  hardware_platform: aisin-repair-0 / rke2-w2 / RTX 4090 24GB
  gpu_model: NVIDIA GeForce RTX 4090
  gpu_vram_gb: 24
  note: F16 GGUF with HF chat-template parity vs transformers FP16

serving:
  n_gpu_layers: -1
  n_ctx: 8192
  n_batch: 512

run_order: [TF_Reason, TF_Mid, TF_Surface]
