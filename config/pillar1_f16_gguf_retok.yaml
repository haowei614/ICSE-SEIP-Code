# Retokenized aligned F16 for Mistral, Llama, and Gemma.
# Same HF token ids as the retokenized Q* ladder. Do not overwrite
# results/pillar1_f16_gguf_aligned (those files used a second BOS).
measurement_basis: A
seed: 20260905
sampling:
  size_per_task: 40
  seed: 20260905
  stratified: true

hardware_profile: rtx4090_aisin_repair
output_dir: results/pillar1_f16_gguf_retok

models:
  - id: mistral_7b_instruct
    name: Mistral-7B-Instruct-v0.3
    hf: mistralai/Mistral-7B-Instruct-v0.3
    gguf_by_precision:
      F16: /workspace/models/gguf/mistral_7b_instruct/mistral_7b_instruct-f16.gguf
  - id: llama31_8b_instruct
    name: Llama-3.1-8B-Instruct
    hf: meta-llama/Llama-3.1-8B-Instruct
    gguf_by_precision:
      F16: /workspace/models/gguf/llama31_8b_instruct/llama31_8b_instruct-f16.gguf
  - id: gemma2_9b_it
    name: Gemma-2-9B-it
    hf: google/gemma-2-9b-it
    gguf_by_precision:
      F16: /workspace/models/gguf/gemma2_9b_it/gemma2_9b_it-f16.gguf

quantization: [F16]
reference_precision: null

tasks:
  - id: TF_Surface
    name: nfr_classification
    kind: classification
    dataset: promise_nfr
    long_context: false
  - id: TF_Mid
    name: anaphoric_span_detection
    kind: span_detection
    dataset: damir_pure
    long_context: false
  - id: TF_Reason
    name: trace_link_recovery
    kind: trace_link
    dataset: trace_etour_locked
    long_context: true

decoding:
  temperature: 0.0
  top_p: 1.0
  top_k: null
  max_new_tokens: 256
  max_input_tokens: 8192
  use_chat_template: true
  enable_thinking: false
  use_grammar: false
  seed: 20260905

reproducibility:
  repeats_per_cell: 1
  n_ctx: 8192
  n_batch: 512

serving:
  n_gpu_layers: -1
  n_ctx: 8192
  n_batch: 512

run_order: [TF_Surface, TF_Mid, TF_Reason]
